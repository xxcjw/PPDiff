image_size: 512
in_channels: 3
latent_channels: 4
user_embedding_dim: 64
item_embedding_dim: 128
max_seq_len: 20
rating_threshold: 4.0
guidance_scale: 2.0

vae:
  pretrained: true
  model_name: /home/caijinwei/disk1/Hugging-Face/sd-vae-ft-mse
  hidden_dims: [64, 128, 256, 512]

unet:
  model_channels: 128
  channel_mult: [1, 2, 4]
  num_res_blocks: 2
  attention_resolutions: [2, 4]
  num_heads: 4
  dropout: 0.0

diffusion:
  timesteps: 400
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: linear
  prediction_type: epsilon

trainer:
  batch_size: 4
  learning_rate: 1.0e-4
  weight_decay: 0.0
  epochs: 100
  grad_clip: 1.0
  save_interval: 10
  sample_interval: 5
  eval_interval: 10
  num_samples: 8
  num_workers: 2
  device: auto
  seed: 42
  output_dir: outputs/diffusion
  checkpoint_dir: checkpoints/diffusion
